# SonarQube / SonarCloud Project Configuration

sonar.projectKey=devsecops-platform
sonar.projectName=DevSecOps Platform Security & Reliability Core
sonar.projectVersion=1.0.0

# Source & Test paths
sonar.sources=server/src,client/src
sonar.tests=server/tests
sonar.sourceEncoding=UTF-8

# Code Coverage Integration
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info

# Path Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.js,**/vite.config.js,**/tailwind.config.js
